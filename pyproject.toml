[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ultratokenkiller"
version = "0.2.0"
description = "Native local input compression, tool output compression and concise agent responses"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "textual>=0.79,<2",
  "tomli>=2; python_version<'3.11'",
  "typer>=0.12,<1",
  "uvicorn>=0.30,<1",
  "websockets>=16,<17",
  "tree-sitter-language-pack==0.13.0",
  "onnxruntime>=1.20,<2",
  "tokenizers>=0.20,<1",
  "numpy>=1.26,<3",
  "tiktoken==0.14.0",
  "pillow==12.3.0",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
utk = "ultratokenkiller.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/ultratokenkiller"]

[tool.pytest.ini_options]
testpaths = ["tests"]
